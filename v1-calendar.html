<!DOCTYPE html>
<html lang="ko" class="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V1 캘린더 중심 · TRUSTA Cockpit</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<style>
  body { font-family: 'Pretendard', 'Inter', system-ui, sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'opsz' 20; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.3); border-radius: 4px; }
  .cal-cell { transition: background 120ms; min-height: 90px; }
  .cal-cell:hover { background: rgba(37, 99, 235, 0.05); cursor: pointer; }
  .dark .cal-cell:hover { background: rgba(129, 140, 248, 0.08); }
  .cal-cell.today { background: rgba(37, 99, 235, 0.1); border-color: #2563EB !important; }
  .dark .cal-cell.today { background: rgba(129, 140, 248, 0.15); border-color: #818CF8 !important; }
  .slide-panel { transition: transform 250ms ease-out; }
  .slide-panel.closed { transform: translateX(100%); }
</style>
</head>
<body class="bg-white dark:bg-[#0F1115] text-slate-900 dark:text-slate-100 transition-colors min-h-screen">

<!-- Header -->
<header class="border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-[#171A21] sticky top-0 z-40">
  <div class="h-14 flex items-center justify-between px-6">
    <div class="flex items-center gap-3">
      <a href="index.html" class="flex items-center gap-2 text-sm text-slate-500 hover:text-blue-500">
        <span class="material-symbols-outlined text-base">arrow_back</span>
        Hub
      </a>
      <span class="text-slate-300 dark:text-slate-600">|</span>
      <span class="text-xs font-bold px-2 py-0.5 bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 rounded-full">V1</span>
      <h1 class="font-bold">캘린더 중심</h1>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-sm text-slate-500">2026-05-27 (수)</span>
      <button onclick="toggleDark()" class="w-9 h-9 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center">
        <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
      </button>
    </div>
  </div>
</header>

<!-- KPI -->
<section class="px-6 pt-6 pb-3">
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
    <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-[#171A21] p-4">
      <div class="flex items-center gap-2 mb-1">
        <span class="material-symbols-outlined text-emerald-500 text-base">cloud_done</span>
        <span class="text-xs text-slate-500">백업</span>
      </div>
      <div class="font-bold">OK · 04:00</div>
      <div class="text-xs text-slate-400 mt-0.5">12.3MB</div>
    </div>
    <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-[#171A21] p-4">
      <div class="flex items-center gap-2 mb-1">
        <span class="material-symbols-outlined text-amber-500 text-base">pending_actions</span>
        <span class="text-xs text-slate-500">승인 대기</span>
      </div>
      <div class="font-bold text-amber-500">3건</div>
      <div class="text-xs text-slate-400 mt-0.5">위험 1 / 보통 1 / 낮음 1</div>
    </div>
    <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-[#171A21] p-4">
      <div class="flex items-center gap-2 mb-1">
        <span class="material-symbols-outlined text-rose-500 text-base">warning</span>
        <span class="text-xs text-slate-500">위험표현</span>
      </div>
      <div class="font-bold text-rose-500">2건</div>
      <div class="text-xs text-slate-400 mt-0.5">사람 검수 필요</div>
    </div>
    <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-blue-500 dark:bg-indigo-500 text-white p-4">
      <div class="flex items-center gap-2 mb-1">
        <span class="material-symbols-outlined text-base">trending_up</span>
        <span class="text-xs opacity-80">이달 발행</span>
      </div>
      <div class="font-bold">47건</div>
      <div class="text-xs opacity-80 mt-0.5">+12 vs 지난달</div>
    </div>
  </div>
</section>

<!-- Calendar + Side panel layout -->
<main class="flex gap-4 px-6 pb-6 h-[calc(100vh-13rem)]">

  <!-- Calendar 70% -->
  <section class="flex-1 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-[#171A21] p-5 overflow-hidden flex flex-col">
    <!-- Month nav -->
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-3">
        <button class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center"><span class="material-symbols-outlined">chevron_left</span></button>
        <h2 class="text-xl font-bold">2026년 5월</h2>
        <button class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center"><span class="material-symbols-outlined">chevron_right</span></button>
        <button class="px-3 py-1 text-xs rounded-md border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">오늘</button>
      </div>
      <!-- Platform legend -->
      <div class="flex items-center gap-3 text-xs">
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-pink-500"></span>Instagram</span>
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-slate-800 dark:bg-white"></span>Threads</span>
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-red-500"></span>YouTube</span>
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-cyan-500"></span>TikTok</span>
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-blue-500"></span>Blog</span>
      </div>
    </div>

    <!-- DOW -->
    <div class="grid grid-cols-7 gap-1 mb-1">
      <div class="text-center text-xs font-bold text-rose-500 py-1">일</div>
      <div class="text-center text-xs font-bold text-slate-400 py-1">월</div>
      <div class="text-center text-xs font-bold text-slate-400 py-1">화</div>
      <div class="text-center text-xs font-bold text-slate-400 py-1">수</div>
      <div class="text-center text-xs font-bold text-slate-400 py-1">목</div>
      <div class="text-center text-xs font-bold text-slate-400 py-1">금</div>
      <div class="text-center text-xs font-bold text-blue-500 py-1">토</div>
    </div>

    <!-- Calendar grid -->
    <div id="cal-grid" class="grid grid-cols-7 gap-1 flex-1 overflow-y-auto">
      <!-- rendered by JS -->
    </div>
  </section>

  <!-- Side slide panel -->
  <aside id="side-panel" class="w-96 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-[#171A21] p-5 overflow-y-auto">
    <div id="panel-empty" class="text-center text-sm text-slate-400 py-12">
      <span class="material-symbols-outlined text-4xl text-slate-300 dark:text-slate-700">touch_app</span>
      <p class="mt-2">캘린더 셀을 클릭하면<br>그날 콘텐츠가 여기 보입니다</p>
    </div>
    <div id="panel-content" class="hidden"></div>
  </aside>

</main>

<script src="mock_data.js"></script>
<script>
function toggleDark() {
  const html = document.documentElement;
  html.classList.toggle('dark');
  localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
  document.getElementById('theme-icon').textContent = html.classList.contains('dark') ? 'light_mode' : 'dark_mode';
  renderCalendar();
}
(function() {
  const saved = localStorage.getItem('theme');
  const prefers = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (saved === 'dark' || (!saved && prefers)) {
    document.documentElement.classList.add('dark');
    document.getElementById('theme-icon').textContent = 'light_mode';
  }
})();

const TODAY = MOCK.today;

function platformDot(p) {
  const map = {
    instagram: 'bg-pink-500',
    threads: 'bg-slate-800 dark:bg-white',
    youtube: 'bg-red-500',
    tiktok: 'bg-cyan-500',
    blog: 'bg-blue-500'
  };
  return map[p] || 'bg-slate-400';
}

function statusBorder(items) {
  const hasHighRisk = items.some(i => i.risk === 'high');
  const hasPending = items.some(i => i.s === 'approval_pending');
  if (hasHighRisk) return 'border-rose-400 dark:border-rose-600';
  if (hasPending) return 'border-amber-400 dark:border-amber-600';
  return 'border-slate-200 dark:border-slate-800';
}

function renderCalendar() {
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  // May 2026: 1일은 금요일
  const firstDow = 5; // 일=0 ... 금=5
  const daysInMonth = 31;
  // 빈칸 (이전달)
  for (let i = 0; i < firstDow; i++) {
    grid.insertAdjacentHTML('beforeend',
      `<div class="cal-cell rounded-lg border border-slate-100 dark:border-slate-900 bg-slate-50 dark:bg-[#0F1115] p-1.5"></div>`);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `2026-05-${String(d).padStart(2,'0')}`;
    const items = MOCK.calendar[dateStr] || [];
    const isToday = dateStr === TODAY;
    const border = isToday ? 'border-blue-500 dark:border-indigo-500' : statusBorder(items);
    const dots = items.slice(0, 6).map(i =>
      `<span class="inline-block w-1.5 h-1.5 rounded-full ${platformDot(i.p)}" title="${i.t}"></span>`
    ).join(' ');
    const count = items.length;
    const todayClass = isToday ? 'today' : '';

    grid.insertAdjacentHTML('beforeend',
      `<div class="cal-cell rounded-lg border ${border} ${todayClass} bg-white dark:bg-[#171A21] p-1.5 flex flex-col" onclick="showDay('${dateStr}')">
        <div class="flex items-center justify-between">
          <span class="text-sm font-semibold ${isToday ? 'text-blue-600 dark:text-indigo-300' : ''}">${d}</span>
          ${count > 0 ? `<span class="text-[10px] text-slate-400">${count}</span>` : ''}
        </div>
        <div class="flex gap-1 mt-1 flex-wrap">${dots}</div>
        ${items.some(i => i.risk === 'high') ? '<span class="text-[10px] text-rose-500 mt-auto">⚠ 위험</span>' : ''}
        ${items.some(i => i.s === 'approval_pending') ? '<span class="text-[10px] text-amber-600 dark:text-amber-400 mt-auto">⏳ 대기</span>' : ''}
      </div>`);
  }
}

function showDay(dateStr) {
  const items = MOCK.calendar[dateStr] || [];
  document.getElementById('panel-empty').classList.add('hidden');
  const panel = document.getElementById('panel-content');
  panel.classList.remove('hidden');
  const platformLabel = { instagram:'Instagram', threads:'Threads', youtube:'YouTube', tiktok:'TikTok', blog:'Blog' };
  const statusBadge = {
    published:        '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300">발행됨</span>',
    approval_pending: '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-300">승인 대기</span>',
    draft:            '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400">초안</span>'
  };
  const riskBadge = {
    high:   '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-rose-100 dark:bg-rose-900/40 text-rose-700 dark:text-rose-300">⚠ 위험</span>',
    medium: '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-orange-100 dark:bg-orange-900/40 text-orange-700 dark:text-orange-300">보통</span>',
    low:    ''
  };

  panel.innerHTML = `
    <div class="flex items-center justify-between mb-4">
      <div>
        <h3 class="font-bold text-lg">${dateStr}</h3>
        <p class="text-xs text-slate-400">${items.length}개 콘텐츠</p>
      </div>
      <button onclick="closeDay()" class="w-7 h-7 rounded hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center"><span class="material-symbols-outlined">close</span></button>
    </div>
    ${items.length === 0 ? '<p class="text-sm text-slate-400 text-center py-8">콘텐츠 없음</p>' :
      items.map(i => `
        <div class="rounded-lg border border-slate-200 dark:border-slate-800 p-3 mb-2 hover:bg-slate-50 dark:hover:bg-slate-900 cursor-pointer">
          <div class="flex items-center justify-between mb-1.5">
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full ${platformDot(i.p)}"></span>
              <span class="text-xs font-semibold text-slate-500">${platformLabel[i.p]}</span>
            </div>
            ${statusBadge[i.s] || ''}
          </div>
          <p class="text-sm font-medium mb-2">${i.t}</p>
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1">
              ${i.score > 0 ? `<span class="text-[10px] text-slate-400">SOTDA</span><span class="text-xs font-bold ${i.score >= 80 ? 'text-emerald-500' : i.score >= 60 ? 'text-amber-500' : 'text-slate-400'}">${i.score}</span>` : '<span class="text-[10px] text-slate-400">미점수</span>'}
            </div>
            ${riskBadge[i.risk] || ''}
          </div>
        </div>
      `).join('')
    }
    <div class="mt-4 pt-4 border-t border-slate-200 dark:border-slate-800 space-y-2">
      <button class="w-full px-3 py-2 text-sm font-semibold rounded-lg bg-blue-500 hover:bg-blue-600 text-white">+ 새 콘텐츠 추가</button>
      <button class="w-full px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-900">레퍼런스 학습</button>
    </div>
  `;
}

function closeDay() {
  document.getElementById('panel-empty').classList.remove('hidden');
  document.getElementById('panel-content').classList.add('hidden');
}

renderCalendar();
// 기본으로 오늘 표시
showDay(TODAY);

document.addEventListener('keydown', e => { if (e.key === 'd' || e.key === 'D') toggleDark(); });
</script>
</body>
</html>
